name: Build iOS IPA

on:
  push:
      branches: [ main ]
        workflow_dispatch:

        jobs:
          build:
              runs-on: macos-latest

                  steps:
                      - name: Checkout
                            uses: actions/checkout@v4

                                - name: Install XcodeGen
                                      run: brew install xcodegen

                                          - name: Generate Xcode Project
                                                run: xcodegen generate

                                                    - name: Build
                                                          run: |
                                                                  xcodebuild -project SubManager.xcodeproj \
                                                                            -scheme SubManager \
                                                                                      -configuration Release \
                                                                                                -sdk iphoneos \
                                                                                                          -derivedDataPath build \
                                                                                                                    CODE_SIGN_IDENTITY="" \
                                                                                                                              CODE_SIGNING_REQUIRED=NO \
                                                                                                                                        CODE_SIGNING_ALLOWED=NO \
                                                                                                                                                  build
                                                                                                                                                  
                                                                                                                                                      - name: Create IPA
                                                                                                                                                            run: |
                                                                                                                                                                    mkdir -p Payload
                                                                                                                                                                            cp -R build/Build/Products/Release-iphoneos/SubManager.app Payload/
                                                                                                                                                                                    zip -r SubManager.ipa Payload
                                                                                                                                                                                            rm -rf Payload
                                                                                                                                                                                            
                                                                                                                                                                                                - name: Upload IPA
                                                                                                                                                                                                      uses: actions/upload-artifact@v4
                                                                                                                                                                                                            with:
                                                                                                                                                                                                                    name: SubManager.ipa
                                                                                                                                                                                                                            path: SubManager.ipa
                                                                                                                                                                                                                            
