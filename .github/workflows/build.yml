name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project SubManager.xcodeproj -scheme SubManager -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
      - run: mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/SubManager.app Payload/ && zip -r SubManager.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SubManager.ipa
          path: SubManager.ipa
